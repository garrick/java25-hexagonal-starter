plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'

    // Line/branch coverage reporting.
    id 'jacoco'

    // Mutation testing: verifies the test suite actually catches injected bugs,
    // not just that it runs and passes.
    alias(libs.plugins.pitest)

    // Static analysis: Checkstyle, PMD, and CPD hooked into the check task.
    id 'com.vanniktech.code.quality.tools' version '0.25.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly libs.junit.platform.launcher

    // Property-based testing.
    testImplementation libs.jqwik

    // Console adapter input/output.
    implementation libs.jline
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.commandline.Main'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

run {
    standardInput = System.in
}

tasks.named('jacocoTestReport') {
    reports {
        html.required = true
        xml.required = true
        csv.required = true
    }
}

// Coverage reporting runs as part of the standard build, not as an opt-in extra step.
tasks.named('check') {
    dependsOn('jacocoTestReport')
}

pitest {
    pitestVersion = libs.versions.pitest.core
    junit5PluginVersion = libs.versions.pitest.junit5.plugin
    targetClasses = ['org.commandline.*']
    // I/O adapter and wiring root are covered by acceptance tests, not mutation tests.
    // excludedClasses = ['org.commandline.adapter.in.console.*', 'org.commandline.Main']
    outputFormats = ['HTML']
}

// Mutation testing runs as part of the standard build, not as an opt-in extra step.
tasks.named('check') {
    dependsOn('pitest')
}

// Static analysis runs as part of the standard build, not as an opt-in extra step.
tasks.named('check') {
    dependsOn('checkstyle', 'pmd', 'cpdCheck')
}

codeQualityTools {
    checkstyle {
        toolVersion = '10.26.1'
    }
    pmd {
        toolVersion = '7.25.0'
    }
    cpd {
        minimumTokenCount = 100
    }
    lint {
        enabled = false
    }
    ktlint {
        enabled = false
    }
}
